name: Build RSS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install
      run: |
        pip install requests beautifulsoup4 feedgen

    - name: Create RSS
      run: |
        python generate_feed.py

    - name: Save feed
      run: |
        git config user.name github-actions
        git config user.email actions@github.com
        git add feed.xml
        git commit -m "Update feed" || exit 0
        git push
